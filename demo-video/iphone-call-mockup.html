<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RingRoute USA — Live AI Receptionist Demo</title>
<style>
  /* RESET + GLOBAL */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  /* STAGE — full viewport, centers the phone */
  .stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(0,212,168,0.10) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 80%, rgba(56,189,248,0.06) 0%, transparent 60%),
      #050810;
    position: relative;
  }

  /* BRANDING — top-left overlay so video shows source */
  .brand {
    position: absolute;
    top: 32px;
    left: 32px;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #00d4a8;
    box-shadow: 0 0 12px rgba(0,212,168,0.7);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .brand-name { color: #00d4a8; font-weight: 700; }

  /* PHONE — iPhone 14 dimensions, 390x844, scaled for visibility */
  .phone {
    width: 390px;
    height: 844px;
    background: #000;
    border-radius: 56px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 12px #1a1a1a,
      0 0 0 14px #2a2a2a,
      0 80px 200px -40px rgba(0,212,168,0.25),
      0 40px 100px -20px rgba(0,0,0,0.8);
  }
  /* Dynamic island */
  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 36px;
    background: #000;
    border-radius: 22px;
    z-index: 30;
  }

  /* iOS status bar */
  .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 58px;
    padding: 18px 32px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    font-weight: 600;
    z-index: 20;
    color: #fff;
  }
  .statusbar svg { display: block; }

  /* CALL SCREEN — fills the phone */
  .callscreen {
    position: absolute;
    inset: 0;
    padding: 70px 24px 32px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #0a1a26 0%, #050b14 50%, #02050a 100%);
    z-index: 10;
  }

  /* Caller header — name, business, status */
  .header {
    text-align: center;
    margin-bottom: 18px;
    padding-top: 8px;
  }
  .caller-number {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .caller-name {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    color: #fff;
  }
  .call-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: rgba(0,212,168,0.12);
    border: 1px solid rgba(0,212,168,0.3);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #00d4a8;
    letter-spacing: 0.05em;
  }
  .call-status .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #00d4a8;
    box-shadow: 0 0 8px rgba(0,212,168,0.8);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .call-timer {
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-top: 8px;
    letter-spacing: 0.06em;
  }

  /* AVATAR (incoming call state) */
  .avatar-ring {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    margin: 24px auto 18px;
    background: linear-gradient(135deg, #00d4a8 0%, #00b894 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 700;
    color: #02261e;
    position: relative;
    box-shadow: 0 0 40px rgba(0,212,168,0.4);
  }
  .avatar-ring::before, .avatar-ring::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(0,212,168,0.5);
    animation: ringExpand 2s ease-out infinite;
  }
  .avatar-ring::after {
    animation-delay: 1s;
  }
  .state-incoming .avatar-ring::before, .state-incoming .avatar-ring::after {
    animation-play-state: running;
  }
  .state-active .avatar-ring {
    width: 64px;
    height: 64px;
    font-size: 24px;
    margin: 4px auto 12px;
  }
  .state-active .avatar-ring::before,
  .state-active .avatar-ring::after { display: none; }

  /* TRANSCRIPT (visible only when active) */
  .transcript {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 4px 8px;
    mask-image: linear-gradient(180deg, transparent 0, #000 24px, #000 calc(100% - 32px), transparent 100%);
    position: relative;
  }
  .transcript-inner {
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .bubble.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .bubble.ai {
    align-self: flex-start;
    background: linear-gradient(135deg, rgba(0,212,168,0.16) 0%, rgba(0,184,148,0.10) 100%);
    border: 1px solid rgba(0,212,168,0.22);
    border-bottom-left-radius: 6px;
    color: #e8fef7;
  }
  .bubble.caller {
    align-self: flex-end;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.10);
    border-bottom-right-radius: 6px;
    color: rgba(255,255,255,0.85);
  }
  .bubble-speaker {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 700;
    margin-bottom: 3px;
    opacity: 0.7;
  }
  .bubble.ai .bubble-speaker { color: #00d4a8; }
  .bubble.caller .bubble-speaker { color: rgba(255,255,255,0.5); }

  /* CONTROL BAR — bottom of phone */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding-top: 18px;
  }
  .controls .ai-pulse {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 24px;
  }
  .controls .ai-pulse span {
    display: block;
    width: 3px;
    background: #00d4a8;
    border-radius: 2px;
    animation: voiceBar 0.9s ease-in-out infinite;
  }
  .controls .ai-pulse span:nth-child(1) { height: 8px; animation-delay: 0s; }
  .controls .ai-pulse span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
  .controls .ai-pulse span:nth-child(3) { height: 20px; animation-delay: 0.2s; }
  .controls .ai-pulse span:nth-child(4) { height: 14px; animation-delay: 0.3s; }
  .controls .ai-pulse span:nth-child(5) { height: 8px; animation-delay: 0.4s; }

  .end-call {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #ff3b30;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px -8px rgba(255,59,48,0.6);
    transition: transform 0.15s ease;
  }
  .end-call:active { transform: scale(0.95); }

  /* START BUTTON — overlay at first */
  .start-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 40;
    cursor: pointer;
    transition: opacity 0.4s ease;
  }
  .start-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .start-btn {
    padding: 18px 36px;
    background: linear-gradient(135deg, #00d4a8 0%, #00b894 100%);
    color: #02261e;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 16px 40px -10px rgba(0,212,168,0.5);
    transition: transform 0.2s ease;
    letter-spacing: 0.02em;
  }
  .start-btn:hover { transform: translateY(-2px); }
  .start-btn:active { transform: translateY(0); }

  /* TAGLINE — under the phone */
  .tagline {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: rgba(255,255,255,0.45);
    font-size: 13px;
    letter-spacing: 0.06em;
  }
  .tagline strong { color: #00d4a8; font-weight: 700; }

  /* KEYFRAMES */
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.15); }
  }
  @keyframes ringExpand {
    0%   { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes voiceBar {
    0%, 100% { transform: scaleY(0.5); }
    50%      { transform: scaleY(1.2); }
  }

  /* SHOW/HIDE states */
  .header-incoming, .header-active { display: none; }
  .state-incoming .header-incoming { display: block; }
  .state-active .header-active    { display: block; }
  .state-incoming .transcript      { display: none; }
  .state-active .avatar-incoming-wrap { display: none; }

  /* RESPONSIVE — scale phone to viewport */
  @media (max-height: 920px) {
    .phone { transform: scale(0.95); }
  }
  @media (max-height: 800px) {
    .phone { transform: scale(0.85); }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="brand">
    <span class="brand-dot"></span>
    <span><span class="brand-name">RingRoute USA</span> · Live AI Receptionist Demo</span>
  </div>

  <div class="phone state-incoming" id="phone">
    <div class="island"></div>

    <!-- iOS status bar -->
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span style="display:inline-flex; gap:6px; align-items:center;">
        <!-- signal -->
        <svg width="18" height="11" viewBox="0 0 18 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="6" rx="0.5"/><rect x="10" y="2" width="3" height="9" rx="0.5"/><rect x="15" y="0" width="3" height="11" rx="0.5"/></svg>
        <!-- wifi -->
        <svg width="16" height="11" viewBox="0 0 16 11" fill="white"><path d="M8 2c2.5 0 4.9 1 6.7 2.8l1.3-1.4C13.9 1.2 11.1 0 8 0 4.9 0 2.1 1.2 0 3.4l1.3 1.4A9.4 9.4 0 0 1 8 2zm0 4a5.4 5.4 0 0 1 3.9 1.6l1.3-1.4A7.4 7.4 0 0 0 8 4c-2 0-3.9.8-5.2 2.2l1.3 1.4A5.4 5.4 0 0 1 8 6zm0 4 1.8-2A2.5 2.5 0 0 0 8 7.5c-.7 0-1.4.3-1.8.7L8 10z"/></svg>
        <!-- battery -->
        <svg width="27" height="11" viewBox="0 0 27 11" fill="none"><rect x="0.5" y="0.5" width="22" height="10" rx="2" stroke="white" stroke-opacity="0.4"/><rect x="2" y="2" width="19" height="7" rx="1" fill="white"/><rect x="23" y="3.5" width="1.5" height="4" rx="0.5" fill="white" fill-opacity="0.4"/></svg>
      </span>
    </div>

    <!-- Call screen content -->
    <div class="callscreen">

      <!-- INCOMING (initial) -->
      <div class="header header-incoming">
        <div class="caller-number">+1 (415) 555-0192 · San Francisco</div>
        <div class="caller-name">Tavola Bistro</div>
        <div style="font-size:14px; color:rgba(255,255,255,0.4); margin-top:8px; letter-spacing:0.04em;">incoming call</div>
      </div>

      <div class="avatar-incoming-wrap">
        <div class="avatar-ring">TB</div>
      </div>

      <!-- ACTIVE (after answer) -->
      <div class="header header-active">
        <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:6px;">
          <div class="avatar-ring" style="margin:0; width:42px; height:42px; font-size:14px;">TB</div>
          <div style="text-align:left;">
            <div class="caller-name" style="font-size:18px; margin:0;">Tavola Bistro</div>
            <div class="caller-number" style="font-size:11px; margin:2px 0 0;">+1 (415) 555-0192</div>
          </div>
        </div>
        <div class="call-status">
          <span class="live-dot"></span>
          RINGROUTE AI · ANSWERING
        </div>
        <div class="call-timer" id="timer">00:00</div>
      </div>

      <!-- Transcript bubbles -->
      <div class="transcript" id="transcript">
        <div class="transcript-inner" id="transcriptInner"></div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="ai-pulse"><span></span><span></span><span></span><span></span><span></span></div>
        <button class="end-call" aria-label="End call">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M3 14a11 11 0 0 1 22 0M9 14v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a3 3 0 0 1 3-3h.5M19 14v3a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-2a3 3 0 0 0-3-3h-.5" transform="rotate(135 14 14)"/></svg>
        </button>
      </div>

    </div>

    <!-- Start overlay -->
    <div class="start-overlay" id="startOverlay">
      <button class="start-btn" id="startBtn">▶  Play Demo Call</button>
    </div>
  </div>

  <div class="tagline">
    <strong>RingRoute USA</strong> · Voice AI that answers your restaurant phone 24/7 · ringrouteusa.com
  </div>

</div>

<!-- Hidden audio element -->
<audio id="demoAudio" preload="auto" src="restaurant-demo.mp3"></audio>

<script>
  // Transcript turns — kept in sync with generate-restaurant-demo.mjs
  const TURNS = [
    { speaker: 'ai',     text: "Thank you for calling Tavola Bistro. I'm your AI hostess — how can I help you today?" },
    { speaker: 'caller', text: "Hi, I'd like to book a table for four this Saturday around 7 PM." },
    { speaker: 'ai',     text: "Wonderful! We have a 7:15 opening — would that work?" },
    { speaker: 'caller', text: "Yes, perfect. The name's Mike." },
    { speaker: 'ai',     text: "Got it, Mike. Table for four, this Saturday at 7:15. Anything we should know — allergies, celebrations, anything special?" },
    { speaker: 'caller', text: "Actually yes — one of us is gluten-free. Do you have options?" },
    { speaker: 'ai',     text: "We do. Our pasta has a gluten-free substitute, and the branzino and short rib are both naturally gluten-free. I'll note it on the reservation." },
    { speaker: 'caller', text: "Perfect. Do you guys validate parking?" },
    { speaker: 'ai',     text: "We do — two hours free at the garage on 4th. I'll text you the confirmation and parking details. See you Saturday at 7:15, Mike!" },
  ];

  const phone        = document.getElementById('phone');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn     = document.getElementById('startBtn');
  const audio        = document.getElementById('demoAudio');
  const transcriptInner = document.getElementById('transcriptInner');
  const transcriptEl = document.getElementById('transcript');
  const timerEl      = document.getElementById('timer');
  const clockEl      = document.getElementById('clock');

  // Set status-bar clock to current time
  function updateClock() {
    const now = new Date();
    let h = now.getHours(); const m = String(now.getMinutes()).padStart(2,'0');
    h = h % 12 || 12;
    clockEl.textContent = `${h}:${m}`;
  }
  updateClock();

  // Pre-render bubbles, all hidden
  TURNS.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = `bubble ${t.speaker}`;
    div.dataset.idx = i;
    div.innerHTML = `<div class="bubble-speaker">${t.speaker === 'ai' ? 'AI · TAVOLA' : 'CALLER'}</div>${t.text}`;
    transcriptInner.appendChild(div);
  });
  const bubbleEls = Array.from(transcriptInner.children);

  let visibleCount = 0;
  function revealNext() {
    if (visibleCount >= bubbleEls.length) return;
    const b = bubbleEls[visibleCount];
    b.classList.add('visible');
    visibleCount++;
    // Auto-scroll: shift the transcript-inner so newest bubble stays near bottom
    const innerHeight = transcriptInner.scrollHeight;
    const viewHeight  = transcriptEl.clientHeight;
    const overflow    = Math.max(0, innerHeight - viewHeight + 16);
    transcriptInner.style.transform = `translateY(${-overflow}px)`;
  }

  function fmtTime(s) {
    const m = Math.floor(s/60), r = Math.floor(s%60);
    return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
  }

  // Compute char-weighted turn start times (proportional to text length so longer
  // lines get more real-time). Falls back to even split if duration is 0.
  function computeTurnTimes(duration) {
    const totalChars = TURNS.reduce((a,t) => a + t.text.length, 0);
    let acc = 0;
    return TURNS.map(t => {
      const start = (acc / totalChars) * duration;
      acc += t.text.length;
      return start;
    });
  }

  let turnStartTimes = [];

  function startCall() {
    startOverlay.classList.add('hidden');
    // Stage 1: ring for 1.8 seconds before answering
    setTimeout(() => {
      phone.classList.remove('state-incoming');
      phone.classList.add('state-active');
      // Stage 2: start audio + transcript sync
      audio.play().catch(err => {
        console.warn('Autoplay blocked, user gesture should have allowed it:', err);
      });
    }, 1800);
  }

  audio.addEventListener('loadedmetadata', () => {
    turnStartTimes = computeTurnTimes(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    if (turnStartTimes.length === 0) {
      turnStartTimes = computeTurnTimes(audio.duration || 60);
    }
    timerEl.textContent = fmtTime(audio.currentTime);
    // Reveal turns whose start time has passed
    while (visibleCount < TURNS.length && audio.currentTime >= turnStartTimes[visibleCount]) {
      revealNext();
    }
  });

  audio.addEventListener('ended', () => {
    // Show a final state — keep transcript visible, gently dim
    transcriptInner.style.opacity = '0.85';
  });

  startBtn.addEventListener('click', startCall);
</script>

</body>
</html>
